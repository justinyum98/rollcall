[project]
name = "rollcall"
version = "0.2.0"
description = "Fill in a Word template once for every student in a spreadsheet."
readme = "README.md"
authors = [
    { name = "Justin Yum", email = "justinyum98@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "docxtpl>=0.20.2",
    "openpyxl>=3.1.5",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[project.scripts]
rollcall = "rollcall.__main__:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
